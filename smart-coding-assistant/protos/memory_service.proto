syntax = "proto3";

package memory;

option go_package = "./proto";

service MemoryService {
  // Key-value context (Redis)
  rpc SaveContext(SaveContextRequest) returns (SaveContextResponse);
  rpc GetContext(GetContextRequest) returns (GetContextResponse);
  rpc DeleteContext(DeleteContextRequest) returns (DeleteContextResponse);
  rpc UpdateContext(UpdateContextRequest) returns (UpdateContextResponse);

  // Vector operations (Milvus)
  rpc SaveVector(SaveVectorRequest) returns (SaveVectorResponse);
  rpc SearchSimilar(SearchSimilarRequest) returns (SearchSimilarResponse);
  rpc DeleteVector(DeleteVectorRequest) returns (DeleteVectorResponse);

  // Knowledge point tracking
  rpc SaveKnowledgePoint(SaveKnowledgePointRequest) returns (SaveKnowledgePointResponse);
  rpc GetKnowledgePoints(GetKnowledgePointsRequest) returns (GetKnowledgePointsResponse);
  rpc GetLearningStats(GetLearningStatsRequest) returns (GetLearningStatsResponse);
}

// --- Key-value context messages ---

message SaveContextRequest {
  string user_id = 1;
  map<string, string> context = 2;
  int64 ttl = 3; // Time to live in seconds
}

message SaveContextResponse {
  bool success = 1;
  string error = 2;
}

message GetContextRequest {
  string user_id = 1;
  repeated string keys = 2; // Optional: specific keys to retrieve
}

message GetContextResponse {
  map<string, string> context = 1;
  bool success = 2;
  string error = 3;
}

message DeleteContextRequest {
  string user_id = 1;
  repeated string keys = 2; // Optional: specific keys to delete
}

message DeleteContextResponse {
  bool success = 1;
  string error = 2;
}

message UpdateContextRequest {
  string user_id = 1;
  map<string, string> context = 2;
  int64 ttl = 3; // Optional: new TTL
}

message UpdateContextResponse {
  bool success = 1;
  string error = 2;
}

// --- Vector messages ---

message SaveVectorRequest {
  string collection = 1;         // Collection name
  repeated VectorData vectors = 2;
}

message VectorData {
  int64 id = 1;                  // Unique vector ID
  repeated float vector = 2;     // Embedding vector
  map<string, string> metadata = 3; // Associated metadata
}

message SaveVectorResponse {
  bool success = 1;
  string error = 2;
  repeated int64 inserted_ids = 3;
}

message SearchSimilarRequest {
  string collection = 1;         // Collection name
  repeated float query_vector = 2;
  int32 top_k = 3;               // Number of results
  map<string, string> filter = 4; // Metadata filter
}

message SearchSimilarResponse {
  bool success = 1;
  string error = 2;
  repeated SearchResult results = 3;
}

message SearchResult {
  int64 id = 1;
  repeated float vector = 2;
  map<string, string> metadata = 3;
  float score = 4;               // Similarity score
}

message DeleteVectorRequest {
  string collection = 1;
  repeated int64 ids = 2;
}

message DeleteVectorResponse {
  bool success = 1;
  string error = 2;
}

// --- Knowledge point messages ---

message KnowledgePoint {
  string topic = 1;
  double mastery = 2;         // 0-1 mastery level
  int32 interactions = 3;     // Number of interactions
  int64 last_seen = 4;        // Last seen timestamp
  int64 first_seen = 5;       // First seen timestamp
}

message SaveKnowledgePointRequest {
  string user_id = 1;
  KnowledgePoint point = 2;
  bool merge = 3;             // true=merge into existing, false=overwrite
}

message SaveKnowledgePointResponse {
  bool success = 1;
  string error = 2;
  string topic = 3;           // Final stored topic name
}

message GetKnowledgePointsRequest {
  string user_id = 1;
  int32 limit = 2;            // 0=return all
  string sort_by = 3;         // "mastery"/"interactions"/"last_seen"
}

message GetKnowledgePointsResponse {
  bool success = 1;
  string error = 2;
  repeated KnowledgePoint points = 3;
}

message GetLearningStatsRequest {
  string user_id = 1;
}

message GetLearningStatsResponse {
  bool success = 1;
  string error = 2;
  int32 total_topics = 3;
  double average_mastery = 4;
  int32 total_interactions = 5;
  int32 mastered_count = 6;     // mastery >= 0.8
  int32 learning_count = 7;     // 0.3 <= mastery < 0.8
  int32 weak_count = 8;         // mastery < 0.3
  int64 study_start_date = 9;
}
