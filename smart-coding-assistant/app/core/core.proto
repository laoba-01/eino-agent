syntax = "proto3";

package core;

option go_package = "smart-coding-assistant/app/core/pb";

service CoreService {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
}

message ChatRequest {
  string user_id = 1;
  string message = 2;
  map<string, string> context = 3;
  string language = 4;   // "zh" | "en", 默认 "zh"
}

message ChatResponse {
  string response = 1;
  bool is_finished = 2;
  map<string, string> context = 3;
  PlanInfo plan = 4;
  repeated StepResult steps = 5;
}

message PlanInfo {
  string plan_id = 1;
  string goal = 2;
  int32 total_steps = 3;
  int32 completed_steps = 4;
}

message StepResult {
  int32 index = 1;
  string description = 2;
  string status = 3;
  string result = 4;
  string error = 5;
}

message GetHistoryRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetHistoryResponse {
  repeated ChatMessage messages = 1;
}

message ChatMessage {
  string id = 1;
  string user_id = 2;
  string role = 3;
  string content = 4;
  int64 timestamp = 5;
}
