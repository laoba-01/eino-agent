syntax = "proto3";

package core;

option go_package = "smart-coding-assistant/app/core/pb";

service CoreService {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
}

message ChatRequest {
  string user_id = 1;
  string message = 2;
  map<string, string> context = 3;
}

message ChatResponse {
  string response = 1;
  bool is_finished = 2;
  map<string, string> context = 3;
}

message GetHistoryRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetHistoryResponse {
  repeated ChatMessage messages = 1;
}

message ChatMessage {
  string id = 1;
  string user_id = 2;
  string role = 3;
  string content = 4;
  int64 timestamp = 5;
}
